[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
dirtbox-core = { path = "crates/core" }
dirtbox-grid = { path = "crates/grid" }
dirtbox-sim = { path = "crates/sim" }
dirtbox-hw = { path = "crates/hw" }
dirtbox-planet = { path = "crates/planet" }
dirtbox-climate = { path = "crates/climate" }
dirtbox-chemistry = { path = "crates/chemistry" }

[profile.release]
debug = 1

# Climate tests run multi-year simulations; optimise them.
[profile.test]
opt-level = 3
