[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
dirtbox-core = { path = "crates/core" }
dirtbox-grid = { path = "crates/grid" }
dirtbox-sim = { path = "crates/sim" }
dirtbox-hw = { path = "crates/hw" }

[profile.release]
debug = 1
